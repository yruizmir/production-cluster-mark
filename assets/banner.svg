<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" overflow="hidden">
  <defs>
    <clipPath id="frame"><rect width="800" height="400"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14151b"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c4dff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="dotsMask"><rect width="800" height="400" fill="url(#fade)"/></mask>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23252d"/>
      <stop offset="1" stop-color="#17181d"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
  <!-- Background: deep gradient, soft glows, fading dot grid -->
  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="590" cy="205" r="260" fill="url(#glowRed)"/>
  <circle cx="110" cy="40" r="230" fill="url(#glowViolet)"/>
  <rect width="800" height="400" fill="url(#dots)" mask="url(#dotsMask)"/>

  <!-- The extension's name -->
  <g font-family="Inter,'SF Pro Display',-apple-system,system-ui,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="58" y="176" font-size="54" font-weight="800" letter-spacing="-1.5" fill="url(#title)">Production</text>
    <text x="58" y="234" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#f5f5f7">Cluster Mark</text>
    <text x="60" y="274" font-size="17" font-weight="400" fill="#8b8e99">Know when you are in production.</text>
  </g>

  <!-- A Lens window, marked as production by its red edge -->
  <g transform="translate(432 100)">
    <rect x="0" y="0" width="310" height="200" rx="16" fill="none" stroke="url(#edge)" stroke-width="10" opacity=".7" filter="url(#blur)"/>
    <rect x="0" y="0" width="310" height="200" rx="16" fill="url(#glass)"/>
    <!-- top bar -->
    <circle cx="20" cy="17" r="4.5" fill="#ff5f57"/>
    <circle cx="34" cy="17" r="4.5" fill="#febc2e"/>
    <circle cx="48" cy="17" r="4.5" fill="#28c840"/>
    <rect x="0" y="34" width="310" height="1" fill="#ffffff" fill-opacity=".07"/>
    <!-- navigator -->
    <rect x="0" y="35" width="76" height="165" fill="#ffffff" fill-opacity=".025"/>
    <rect x="14" y="50" width="46" height="6" rx="3" fill="#3d404a"/>
    <rect x="20" y="66" width="42" height="6" rx="3" fill="url(#edge)"/>
    <rect x="20" y="82" width="36" height="6" rx="3" fill="#3d404a"/>
    <rect x="20" y="98" width="44" height="6" rx="3" fill="#3d404a"/>
    <rect x="20" y="114" width="32" height="6" rx="3" fill="#3d404a"/>
    <!-- content -->
    <text x="92" y="58" font-family="Inter,-apple-system,system-ui,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#e6e6ea">prod-eu</text>
    <rect x="92" y="70" width="200" height="50" rx="8" fill="#ffffff" fill-opacity=".045"/>
    <path d="M104 106 L124 96 L142 101 L162 86 L182 92 L202 80 L222 88 L242 78 L262 84 L280 76" fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="92" y="130" width="96" height="52" rx="8" fill="#ffffff" fill-opacity=".045"/>
    <rect x="196" y="130" width="96" height="52" rx="8" fill="#ffffff" fill-opacity=".045"/>
    <rect x="104" y="144" width="40" height="6" rx="3" fill="#3d404a"/>
    <rect x="104" y="158" width="60" height="10" rx="5" fill="#4a4d58"/>
    <rect x="208" y="144" width="40" height="6" rx="3" fill="#3d404a"/>
    <rect x="208" y="158" width="52" height="10" rx="5" fill="#4a4d58"/>
    <!-- the red edge -->
    <rect x="2" y="2" width="306" height="196" rx="14" fill="none" stroke="url(#edge)" stroke-width="4"/>
  </g>

  <!-- Floating PROD chip -->
  <g transform="translate(668 82)" filter="url(#shadow)">
    <rect x="0" y="0" width="82" height="30" rx="15" fill="url(#edge)"/>
    <circle cx="17" cy="15" r="4" fill="#fff"/>
    <text x="29" y="20" font-family="Inter,-apple-system,system-ui,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1" fill="#fff">PROD</text>
  </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2d35"/>
      <stop offset="1" stop-color="#16171b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- A Lens window, marked as production by its red edge -->
  <g transform="translate(127 16) scale(1.3)">
    <rect x="0" y="0" width="420" height="260" rx="12" fill="none" stroke="#e53935" stroke-width="10" opacity=".45" filter="url(#glow)"/>
    <rect x="0" y="0" width="420" height="260" rx="12" fill="#1e1f24"/>
    <!-- top bar -->
    <rect x="0" y="0" width="420" height="30" rx="12" fill="#2b2d33"/>
    <rect x="0" y="18" width="420" height="12" fill="#2b2d33"/>
    <circle cx="20" cy="15" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="15" r="5" fill="#febc2e"/>
    <circle cx="52" cy="15" r="5" fill="#28c840"/>
    <!-- navigator -->
    <rect x="0" y="30" width="110" height="230" fill="#24262b"/>
    <rect x="14" y="48" width="70" height="8" rx="4" fill="#4a4d55"/>
    <rect x="22" y="68" width="62" height="8" rx="4" fill="#e53935"/>
    <rect x="22" y="88" width="54" height="8" rx="4" fill="#4a4d55"/>
    <rect x="22" y="108" width="66" height="8" rx="4" fill="#4a4d55"/>
    <rect x="22" y="128" width="48" height="8" rx="4" fill="#4a4d55"/>
    <!-- tab and content -->
    <rect x="110" y="30" width="120" height="26" fill="#1e1f24"/>
    <rect x="110" y="30" width="120" height="3" fill="#e53935"/>
    <text x="124" y="48" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#e6e6e6">prod-eu</text>
    <rect x="110" y="56" width="310" height="1" fill="#34363c"/>
    <rect x="130" y="76" width="130" height="10" rx="5" fill="#3b3e45"/>
    <rect x="130" y="100" width="260" height="60" rx="6" fill="#2a2c32"/>
    <rect x="130" y="172" width="120" height="60" rx="6" fill="#2a2c32"/>
    <rect x="262" y="172" width="128" height="60" rx="6" fill="#2a2c32"/>
    <!-- the red edge -->
    <rect x="3" y="3" width="414" height="254" rx="10" fill="none" stroke="#e53935" stroke-width="6"/>
  </g>

  <text x="400" y="386" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5" fill="#e53935">PRODUCTION CLUSTER MARK</text>
</svg>
